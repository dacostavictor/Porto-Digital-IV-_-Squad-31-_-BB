<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contatos de confiança</title>
    <link rel="stylesheet" href="listaContatos.css" />
  </head>
  <body>
    <img
      src="../assets/logoBB.png"
      alt="logo do Banco do Brasil"
      height="100"
    />
    <h1>Contatos de confiança</h1>

    <main class="conteudo">
      <p class="aviso" id="aviso" role="status" hidden>
        Cadastro realizado! Seus contatos foram enviados para análise.
      </p>

      <ul class="lista" id="lista"></ul>

      <p class="vazio" id="vazio" hidden>
        Nenhum contato de confiança cadastrado.
      </p>

      <a href="cadastroEmail.html" class="botao">Cadastrar novo contato</a>
    </main>

    <script src="listaContatos.js"></script>
  </body>
</html>
